name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # macos-15 고정: Package.swift 가 swift-tools-version 6.0(Xcode 16 이상)을 요구한다.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Shell syntax
        run: |
          for script in scripts/*.sh; do
            case "$script" in
              scripts/install.sh|scripts/uninstall.sh) sh -n "$script" ;;
              *) bash -n "$script" ;;
            esac
          done

  # 설치 스크립트를 실제 묶음으로 끝까지 돌려 본다(임시 HOME, 가짜 open/lsappinfo/osascript).
  installer:
    runs-on: macos-15
    timeout-minutes: 30
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build the release bundle
        run: scripts/build-app.sh --release

      - name: Install / uninstall against a temp HOME
        run: scripts/test-install-scripts.sh
