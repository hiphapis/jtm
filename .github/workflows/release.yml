name: Release

# v* 태그를 push 하면 WhereWasI-<version>.zip 과 WhereWasI-<version>.dmg, 각각의 .sha256 을 만들어 GitHub Release 로 올린다.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 빌드 번호(CFBundleVersion)가 커밋 수라서 전체 기록이 필요하다

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Tag must match VERSION
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          file_version="$(tr -d '[:space:]' < VERSION)"
          if [ "$version" != "$file_version" ]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION ($file_version)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: swift test

      - name: Build the release bundle
        run: scripts/build-app.sh --release --dmg --version "${{ steps.version.outputs.version }}"

      - name: Installer end to end
        run: scripts/test-install-scripts.sh "dist/WhereWasI-${{ steps.version.outputs.version }}.zip"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WhereWasI-${{ steps.version.outputs.version }}.zip
            dist/WhereWasI-${{ steps.version.outputs.version }}.zip.sha256
            dist/WhereWasI-${{ steps.version.outputs.version }}.dmg
            dist/WhereWasI-${{ steps.version.outputs.version }}.dmg.sha256
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
